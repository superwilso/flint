[package]
name = "flint"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Copy a music library to a Sony NW-A50-series Walkman, with SensMe analysis and without touching the PC's files"

[dependencies]
flint-core = { path = "../flint-core" }
flint-gui = { path = "../flint-gui" }

[features]
# One file to download: the 32-bit SensMe helper rides inside flint.exe.
embed-helper = ["flint-core/embed-helper"]
